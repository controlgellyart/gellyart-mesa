<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio a la Mesa - GellyArt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }
        /* Recuadro azul original pero con texto más grande */
        .app-title-box {
            background-color: #314155;
            color: white;
            padding: 12px;
            border-radius: 6px;
            font-size: 18px; /* Texto más grande para el nombre de la app */
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }
        .mesa-info {
            font-size: 14px;
            font-weight: bold;
            color: #d35400;
            margin-bottom: 15px;
        }
        /* Pregunta fundamental más grande para lectura inmediata */
        .question {
            font-size: 18px; /* Texto más grande para la pregunta clave */
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }
        .btn-servicio {
            background-color: #f1c40f;
            color: #2c3e50;
        }
        .btn-cuenta {
            background-color: #314155;
            color: white;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #95a5a6;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Recuadro azul original con texto ampliado -->
        <div class="app-title-box">SERVICIO A LA MESA</div>
        
        <div class="mesa-info" id="mesa-info">CARGANDO...</div>
        
        <!-- Pregunta fundamental ampliada -->
        <div class="question">¿Cómo podemos ayudarte?</div>

        <button class="btn btn-servicio" onclick="enviarSolicitud('SERVICIO')">🔔 SERVICIO</button>
        <button class="btn btn-cuenta" onclick="enviarSolicitud('CUENTA')">💳 CUENTA</button>
        
        <div class="footer">By GellyArt</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const negocio = urlParams.get('negocio') || 'GellyArt';
        const mesa = urlParams.get('mesa') || '1';
        
        document.getElementById('mesa-info').innerText = `${negocio.toUpperCase()} - MESA ${mesa}`;

        function enviarSolicitud(tipo) {
            alert(`Solicitud de ${tipo} enviada para ${negocio}, Mesa ${mesa}`);
        }
    </script>
</body>
</html>
