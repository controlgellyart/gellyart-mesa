<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio a la Mesa - GellyArt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fcfcfc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
            width: 320px;
            border: 1px solid #eaeaea;
        }
        h2 {
            font-size: 14px;
            letter-spacing: 1px;
            color: #fff;
            background: #343a40;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .mesa-info {
            font-size: 16px;
            font-weight: bold;
            color: #c69214;
            margin-bottom: 15px;
        }
        .pregunta {
            font-size: 15px;
            color: #495057;
            margin-bottom: 25px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
        .btn-servicio {
            background-color: #f1a80a;
            color: #000;
        }
        .btn-cuenta {
            background-color: #343a40;
            color: #fff;
        }
        #mensaje {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            min-height: 20px;
        }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #adb5bd;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>SERVICIO A LA MESA</h2>
        <div class="mesa-info" id="infoMesa">CARGANDO...</div>
        <div class="pregunta">¿Cómo podemos ayudarte?</div>

        <button class="btn btn-servicio" onclick="enviarAccion('SERVICIO')">
            🛎️ SERVICIO
        </button>

        <button class="btn btn-cuenta" onclick="enviarAccion('CUENTA')">
            💳 CUENTA
        </button>

        <div id="mensaje"></div>

        <div class="footer">By GellyArt</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const negocio = urlParams.get('negocio') || 'GENERAL';
        const mesa = urlParams.get('mesa') || '1';

        document.getElementById('infoMesa').innerText = `${negocio} — MESA ${mesa}`;

        function enviarAccion(accion) {
            const msgDiv = document.getElementById('mensaje');
            msgDiv.style.color = "#c69214";
            msgDiv.innerText = "Enviando solicitud...";

            const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwHZTPuHu8cVLeBsGHSFD8L7M-DrX1rG5rIQ2NcR03RQ3i-TCQBaQ-8bh4Q0luXLskBBQ/exec";

            // Petición GET limpia y compatible con Apps Script sin bloqueos CORS
            const urlFinal = `${URL_APPS_SCRIPT}?negocio=${encodeURIComponent(negocio)}&mesa=${encodeURIComponent(mesa)}&accion=${encodeURIComponent(accion)}`;

            fetch(urlFinal, {
                method: "GET",
                mode: "no-cors"
            })
            .then(() => {
                msgDiv.style.color = "#2b8a3e";
                msgDiv.innerText = "¡Solicitud enviada con éxito!";
                setTimeout(() => { msgDiv.innerText = ""; }, 4000);
            })
            .catch(error => {
                msgDiv.style.color = "#c92a2a";
                msgDiv.innerText = "Error al enviar. Intenta de nuevo.";
                console.error("Detalle:", error);
            });
        }
    </script>
</body>
</html>
