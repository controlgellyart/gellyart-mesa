<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio a la Mesa - GellyArt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }
        .btn-servicio {
            background-color: #ffc107;
            color: #333;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-cuenta {
            background-color: #343a40;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        /* Recuadro de estado debajo del botón Cuenta */
        #estadoMensaje {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            display: none; /* Oculto por defecto hasta validar */
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>SERVICIO A LA MESA</h2>
        <h4 id="infoMesa" style="color: #d97706;">Cargando...</h4>
        <p>¿Cómo podemos ayudarte?</p>
        
        <button class="btn-servicio" onclick="enviarAccion('Servicio')">🛎️ SERVICIO</button>
        <button class="btn-cuenta" onclick="enviarAccion('Cuenta')">💳 CUENTA</button>
        
        <!-- Contenedor exacto debajo del botón CUENTA -->
        <div id="estadoMensaje"></div>
    </div>

    <script>
        // Obtener parámetros de la URL (Negocio y Mesa)
        const urlParams = new URLSearchParams(window.location.search);
        const negocio = urlParams.get('negocio');
        const mesa = urlParams.get('mesa');

        const infoMesaEl = document.getElementById('infoMesa');
        const estadoMensaje = document.getElementById('estadoMensaje');

        if (negocio && mesa) {
            infoMesaEl.innerText = `${negocio} - MESA ${mesa}`;
            
            // AQUÍ SE MANTIENE TU VALIDACIÓN ORIGINAL CON EL BACKEND (Apps Script)
            // Reemplaza esta URL con tu Web App desplegada de Apps Script si es necesario
            const urlValidacion = `https://script.google.com/macros/s/TU_SCRIPT_ID/exec?negocio=${encodeURIComponent(negocio)}&mesa=${encodeURIComponent(mesa)}`;

            fetch(urlValidacion)
                .then(response => response.json())
                .then(data => {
                    estadoMensaje.style.display = "block";
                    if (data.status === "DENEGADO" || data.valido === false) {
                        // Recuadro en ROJO para accesos no encontrados en control
                        estadoMensaje.style.backgroundColor = "#f8d7da";
                        estadoMensaje.style.color = "#721c24";
                        estadoMensaje.style.border = "1px solid #f5c6cb";
                        estadoMensaje.innerText = "DENEGADO: Código no registrado o inválido";
                    } else {
                        // Estado exitoso / autorizado
                        estadoMensaje.style.backgroundColor = "#d4edda";
                        estadoMensaje.style.color = "#155724";
                        estadoMensaje.style.border = "1px solid #c3e6cb";
                        estadoMensaje.innerText = "Acceso Autorizado";
                    }
                })
                .catch(error => {
                    console.error("Error en validación:", error);
                });

        } else {
            infoMesaEl.innerText = "Parámetros incompletos";
            estadoMensaje.style.display = "block";
            estadoMensaje.style.backgroundColor = "#f8d7da";
            estadoMensaje.style.color = "#721c24";
            estadoMensaje.innerText = "DENEGADO: Faltan datos en el QR";
        }

        function enviarAccion(tipo) {
            // Lógica de tus botones de servicio/cuenta existente
            alert("Acción enviada: " + tipo);
        }
    </script>

</body>
</html>
