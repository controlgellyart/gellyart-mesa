<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio a la Mesa - GellyArt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }
        .app-title-box {
            background-color: #314155;
            color: white;
            padding: 12px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }
        .mesa-info {
            font-size: 14px;
            font-weight: bold;
            color: #d35400;
            margin-bottom: 15px;
        }
        .question {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }
        .btn-servicio {
            background-color: #f1c40f;
            color: #2c3e50;
        }
        .btn-cuenta {
            background-color: #314155;
            color: white;
        }
        /* Recuadro visual dentro de la plantilla para la alerta denegada */
        #alerta-denegada {
            display: none;
            background-color: #fde8e8;
            color: #c0392b;
            border: 1px solid #f5c6cb;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
        }
        #mensaje-estado {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
            min-height: 20px;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #95a5a6;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="app-title-box">SERVICIO A LA MESA</div>
        
        <div class="mesa-info" id="mesa-info">CARGANDO...</div>
        
        <div class="question">¿Cómo podemos ayudarte?</div>

        <button class="btn btn-servicio" onclick="enviarSolicitud('🛎️ SERVICIO')">🛎️ SERVICIO</button>
        <button class="btn btn-cuenta" onclick="enviarSolicitud('💳 CUENTA')">💳 CUENTA</button>
        
        <!-- Recuadro rojo dentro de la plantilla (Oculto por defecto) -->
        <div id="alerta-denegada">⚠️ ALERTA DENEGADA</div>

        <div id="mensaje-estado"></div>

        <div class="footer">By GellyArt</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const negocio = urlParams.get('negocio') || 'GellyArt';
        const mesa = urlParams.get('mesa') || '1';
        
        document.getElementById('mesa-info').innerText = `${negocio.toUpperCase()} - MESA ${mesa}`;

        function enviarSolicitud(tipoServicio) {
            const estadoDiv = document.getElementById('mensaje-estado');
            const alertaDiv = document.getElementById('alerta-denegada');

            // Limpiamos estados previos
            alertaDiv.style.display = 'none';
            estadoDiv.style.color = "#2980b9";
            estadoDiv.innerHTML = "Enviando aviso...";

            // URL exacta de tu Apps Script conectado a la hoja SOLICITUDES y Telegram
            const scriptURL = 'https://script.google.com/macros/s/AKfycbwHZTPuHu8cVLeBsGHSFD8L7M-DrX1rG5rIQ2NcR03RQ3i-TCQBaQ-8bh4Q0luXLskBBQ/exec';

            const datos = {
                negocio: negocio,
                mesa: mesa,
                tipo: tipoServicio
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datos)
            })
            .then(() => {
                estadoDiv.style.color = "#27ae60";
                estadoDiv.innerHTML = "¡Solicitud enviada con éxito!";
                setTimeout(() => {
                    estadoDiv.innerHTML = "";
                }, 4000);
            })
            .catch(error => {
                console.error('Error!', error);
                estadoDiv.style.color = "#c0392b";
                estadoDiv.innerHTML = "Hubo un error al enviar. Intenta de nuevo.";
            });
        }
    </script>
</body>
</html>
