<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio a la Mesa - GellyArt</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            width: 100%;
            max-width: 380px;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
        }
        .header-badge {
            background-color: #4a5568;
            color: white;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .mesa-info {
            color: #d69e2e;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .instruction {
            color: #2d3748;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 25px;
        }
        .btn-servicio {
            background-color: #ecc94b;
            color: #1a202c;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(236, 201, 75, 0.3);
            transition: all 0.2s ease;
        }
        .btn-servicio:hover { background-color: #d69e2e; }
        .btn-cuenta {
            background-color: #2d3748;
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(45, 55, 72, 0.3);
            transition: all 0.2s ease;
        }
        .btn-cuenta:hover { background-color: #1a202c; }
        
        /* Vista de éxito exacta a tu captura */
        .success-box {
            background-color: #e6fffa;
            border: 2px solid #38b2ac;
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .success-box h3 {
            color: #2b6cb0;
            font-size: 18px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .success-box p {
            color: #2d3748;
            font-size: 15px;
        }
        .footer-brand {
            color: #a0aec0;
            font-size: 13px;
            margin-top: 10px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-badge">SERVICIO A LA MESA</div>
        
        <div id="infoNegocioMesa" class="mesa-info">ESTHELLA - MESA 3</div>
        
        <!-- Pantalla Principal de Botones -->
        <div id="vistaPrincipal">
            <div class="instruction">¿Cómo podemos ayudarte?</div>
            <button class="btn-servicio" onclick="enviarSolicitud('SERVICIO')">🛎️ SERVICIO</button>
            <button class="btn-cuenta" onclick="enviarSolicitud('CUENTA')">💳 CUENTA</button>
        </div>

        <!-- Pantalla de Éxito (idéntica a tu diseño verde/agua) -->
        <div id="vistaExito" class="hidden">
            <div class="instruction" style="margin-bottom: 15px;">¿Cómo podemos ayudarte?</div>
            <div class="success-box">
                <h3>✅ ¡Solicitud enviada!</h3>
                <p>Enseguida estamos contigo.</p>
            </div>
        </div>

        <div class="footer-brand">By GellyArt</div>
    </div>

    <script>
        // Leer parámetros de la URL (?negocio=ESTHELLA&mesa=3)
        const urlParams = new URLSearchParams(window.location.search);
        const negocio = urlParams.get('negocio') || 'ESTHELLA';
        const mesa = urlParams.get('mesa') || '3';

        // Mostrar dinámicamente en pantalla
        document.getElementById('infoNegocioMesa').innerText = `${negocio} - MESA ${mesa}`;

        function enviarSolicitud(tipo) {
            // URL de tu Web App de Google Apps Script
            const urlWebHook = "TU_URL_DE_GOOGLE_APPS_SCRIPT";

            // Cambiar visualmente a la pantalla de éxito de inmediato
            document.getElementById('vistaPrincipal').classList.add('hidden');
            document.getElementById('vistaExito').classList.remove('hidden');

            // Enviar datos al Apps Script en segundo plano
            fetch(urlWebHook, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    negocio: negocio, 
                    mesa: mesa, 
                    tipo: tipo 
                })
            }).catch(error => {
                console.error('Error al enviar:', error);
            });

            // Regresar a los botones principales después de 6 segundos por si necesitan otra acción
            setTimeout(() => {
                document.getElementById('vistaExito').classList.add('hidden');
                document.getElementById('vistaPrincipal').classList.remove('hidden');
            }, 6000);
        }
    </script>
</body>
</html>
