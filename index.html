<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GellyArt - Servicio a la Mesa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 380px;
        }
        h2 {
            margin-top: 0;
            color: #ffb703;
            font-size: 1.5rem;
        }
        .mesa-info {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: #e0e0e0;
        }
        .btn {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 15px;
            color: white;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
        .btn-mesero {
            background-color: #d90429;
        }
        .btn-cuenta {
            background-color: #0077b6;
        }
        #mensaje {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1rem;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>GELLYART</h2>
        <div class="mesa-info" id="infoMesa">Cargando datos...</div>

        <button class="btn btn-mesero" onclick="enviarAccion('LLAMAR AL MESERO')">🛎️ LLAMAR AL MESERO</button>
        <button class="btn btn-cuenta" onclick="enviarAccion('PEDIR LA CUENTA')">💳 PEDIR LA CUENTA</button>

        <div id="mensaje"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const negocio = urlParams.get('negocio') || 'GellyArt';
        const mesa = urlParams.get('mesa') || '1';

        document.getElementById('infoMesa').innerHTML = `Negocio: <strong>${decodeURIComponent(negocio)}</strong><br>Mesa: <strong>${mesa}</strong>`;

        function enviarAccion(accion) {
            const msgDiv = document.getElementById('mensaje');
            msgDiv.style.color = "#ffb703";
            msgDiv.innerText = "Enviando solicitud...";

            google.script.run
                .withSuccessHandler(function(response) {
                    msgDiv.style.color = "#38b000";
                    msgDiv.innerText = "¡Solicitud enviada con éxito!";
                    setTimeout(() => { msgDiv.innerText = ""; }, 4000);
                })
                .withFailureHandler(function(error) {
                    msgDiv.style.color = "#d90429";
                    msgDiv.innerText = "Error al enviar. Intenta de nuevo.";
                })
                .registrarSolicitud(negocio, mesa, accion);
        }
    </script>
</body>
</html>
