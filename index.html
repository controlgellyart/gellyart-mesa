<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GELLYART - Servicio a la Mesa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .mesa-info {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-mesero {
            background-color: #007bff;
        }
        .btn-mesero:hover {
            background-color: #0056b3;
        }
        .btn-cuenta {
            background-color: #28a745;
        }
        .btn-cuenta:hover {
            background-color: #218838;
        }
        #mensaje {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="nombre-negocio">Cargando...</h1>
        <div class="mesa-info" id="numero-mesa">Mesa --</div>

        <button class="btn btn-mesero" onclick="enviarSolicitud('Llamar al Mesero')">🔔 Llamar al Mesero</button>
        <button class="btn btn-cuenta" onclick="enviarSolicitud('Pedir la Cuenta')">💵 Pedir la Cuenta</button>

        <div id="mensaje"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const negocio = urlParams.get('negocio') || 'GellyArt';
        const mesa = urlParams.get('mesa') || '1';

        document.getElementById('nombre-negocio').innerText = negocio;
        document.getElementById('numero-mesa').innerText = 'Mesa ' + mesa;

        const scriptURL = 'https://script.google.com/macros/s/AKfycbwHZTPuHu8cVLeBsGHSFD8L7M-DrX1rG5rIQ2NcR03RQ3i-TCQBaQ-8bh4Q0luXLskBBQ/exec';

        function enviarSolicitud(accion) {
            const mensajeDiv = document.getElementById('mensaje');
            mensajeDiv.style.color = '#007bff';
            mensajeDiv.innerText = 'Enviando solicitud...';

            const datos = {
                negocio: negocio,
                mesa: mesa,
                accion: accion
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datos)
            })
            .then(() => {
                mensajeDiv.style.color = '#28a745';
                mensajeDiv.innerText = '¡Solicitud enviada con éxito!';
                setTimeout(() => { mensajeDiv.innerText = ''; }, 4000);
            })
            .catch(error => {
                console.error('Error:', error);
                mensajeDiv.style.color = '#dc3545';
                mensajeDiv.innerText = 'Hubo un error al enviar.';
            });
        }
    </script>
</body>
</html>
