<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio a la Mesa - GellyArt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }
        .app-title-box {
            background-color: #314155;
            color: white;
            padding: 12px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }
        .mesa-info {
            font-size: 14px;
            font-weight: bold;
            color: #d35400;
            margin-bottom: 15px;
        }
        .question {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }
        .btn-servicio {
            background-color: #f1c40f;
            color: #2c3e50;
        }
        .btn-cuenta {
            background-color: #314155;
            color: white;
        }
        /* Recuadro visual dentro de la plantilla ubicado debajo del botón Cuenta */
        #mensaje-estado {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #95a5a6;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="app-title-box">SERVICIO A LA MESA</div>
        
        <div class="mesa-info" id="mesa-info">CARGANDO...</div>
        
        <div class="question">¿Cómo podemos ayudarte?</div>

        <button class="btn btn-servicio" onclick="enviarSolicitud('🛎️ SERVICIO')">🛎️ SERVICIO</button>
        <button class="btn btn-cuenta" onclick="enviarSolicitud('💳 CUENTA')">💳 CUENTA</button>
        
        <!-- Recuadro integrado exactamente debajo del botón CUENTA -->
        <div id="mensaje-estado"></div>

        <div class="footer">By GellyArt</div>
    </div>

    <script>
        // Capturar los parámetros reales de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const negocio = urlParams.get('negocio') || '';
        const mesa = urlParams.get('mesa') || '';
        
        const mesaInfoEl = document.getElementById('mesa-info');
        if (negocio && mesa) {
            mesaInfoEl.innerText = `${negocio.toUpperCase()} - MESA ${mesa}`;
        } else {
            mesaInfoEl.innerText = "MESA NO VÁLIDA";
        }

        function enviarSolicitud(tipoServicio) {
            const estadoDiv = document.getElementById('mensaje-estado');
            estadoDiv.style.display = "block";

            // Validación local preventiva o si faltan parámetros en la URL
            if (!negocio || !mesa) {
                estadoDiv.style.backgroundColor = "#fde8e8";
                estadoDiv.style.color = "#c0392b";
                estadoDiv.style.border = "1px solid #f5c6cb";
                estadoDiv.innerHTML = "⚠️ ALERTA DENEGADA: Parámetros incompletos";
                return;
            }

            estadoDiv.style.backgroundColor = "#e8f4fd";
            estadoDiv.style.color = "#2980b9";
            estadoDiv.style.border = "1px solid #bbe1fa";
            estadoDiv.innerHTML = "Enviando aviso...";

            // URL real de tu Web App de Apps Script
            const scriptURL = 'https://script.google.com/macros/s/AKfycbwHZTPuHu8cVLeBsGHSFD8L7M-DrX1rG5rIQ2NcR03RQ3i-TCQBaQ-8bh4Q0luXLskBBQ/exec';

            const datos = {
                negocio: negocio,
                mesa: mesa,
                tipo: tipoServicio
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datos)
            })
            .then(() => {
                estadoDiv.style.backgroundColor = "#d4edda";
                estadoDiv.style.color = "#155724";
                estadoDiv.style.border = "1px solid #c3e6cb";
                estadoDiv.innerHTML = "¡Solicitud enviada con éxito!";
                setTimeout(() => {
                    estadoDiv.style.display = "none";
                }, 4000);
            })
            .catch(error => {
                console.error('Error!', error);
                estadoDiv.style.backgroundColor = "#fde8e8";
                estadoDiv.style.color = "#c0392b";
                estadoDiv.style.border = "1px solid #f5c6cb";
                estadoDiv.innerHTML = "Hubo un error al enviar. Intenta de nuevo.";
            });
        }
    </script>
</body>
</html>
