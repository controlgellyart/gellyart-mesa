<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Servicio a la Mesa - GellyArt</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #FAF9F6;
            color: #2b2b2b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 320px;
            box-sizing: border-box;
        }
        .header-pill {
            background-color: #343a40;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 10px 15px;
            border-radius: 30px;
            margin-bottom: 18px;
            text-transform: uppercase;
        }
        .mesa-info {
            font-size: 0.95rem;
            font-weight: bold;
            color: #c69214;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .pregunta {
            font-size: 1.15rem;
            font-weight: 600;
            color: #2b2b2b;
            margin-bottom: 22px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin-bottom: 12px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s ease, opacity 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        .btn-servicio {
            background-color: #e5af30;
            color: #ffffff;
        }
        .btn-cuenta {
            background-color: #343a40;
            color: #ffffff;
        }
        .footer-brand {
            margin-top: 15px;
            font-size: 0.75rem;
            color: #8c8c8c;
            letter-spacing: 0.5px;
        }
        #mensaje {
            margin-top: 12px;
            font-weight: bold;
            font-size: 0.85rem;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-pill">SERVICIO A LA MESA</div>
        
        <div class="mesa-info" id="infoMesa">Cargando...</div>
        <div class="pregunta">¿Cómo podemos ayudarte?</div>

        <button class="btn btn-servicio" onclick="enviarAccion('LLAMAR AL MESERO')">
            <span>🛎️</span> SERVICIO
        </button>
        <button class="btn btn-cuenta" onclick="enviarAccion('PEDIR LA CUENTA')">
            <span>💳</span> CUENTA
        </button>

        <div id="mensaje"></div>

        <div class="footer-brand">By GellyArt</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const negocio = urlParams.get('negocio') || 'GENERAL';
        const mesa = urlParams.get('mesa') || '1';

        document.getElementById('infoMesa').innerText = `${negocio} — MESA ${mesa}`;

        function enviarAccion(accion) {
            const msgDiv = document.getElementById('mensaje');
            msgDiv.style.color = "#c69214";
            msgDiv.innerText = "Enviando solicitud...";

            const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwHZTPuHu8cVLeBsGHSFD8L7M-DrX1rG5rIQ2NcR03RQ3i-TCQBaQ-8bh4Q0luXLskBBQ/exec";

            fetch(URL_APPS_SCRIPT, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    negocio: negocio,
                    mesa: mesa,
                    accion: accion
                })
            })
            .then(response => {
                msgDiv.style.color = "#2b8a3e";
                msgDiv.innerText = "¡Solicitud enviada con éxito!";
                setTimeout(() => { msgDiv.innerText = ""; }, 4000);
            })
            .catch(error => {
                msgDiv.style.color = "#c92a2a";
                msgDiv.innerText = "Error al enviar. Intenta de nuevo.";
                console.error("Detalle del error:", error);
            });
        }
    </script>
</body>
</html>
