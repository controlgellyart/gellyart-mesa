<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio a la Mesa - GellyArt</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 1.25rem;
            color: #333333;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #d69e2e;
            margin-bottom: 25px;
            font-weight: bold;
        }
        .btn {
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            color: white;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-service { background-color: #2e7d32; }
        .btn-bill { background-color: #1565c0; }
        #status-message {
            margin-top: 15px;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: none;
            font-weight: bold;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>GellyArt - Servicio</h1>
        <div class="subtitle" id="info-negocio">Cargando mesa...</div>

        <button class="btn btn-service" onclick="enviarSolicitud('LLAMAR AL MESERO')">
            🛎️ LLAMAR AL MESERO
        </button>

        <button class="btn btn-bill" onclick="enviarSolicitud('PEDIR LA CUENTA')">
            💳 PEDIR LA CUENTA
        </button>

        <div id="status-message">✅ ¡Solicitud enviada! En un momento te atendemos.</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const negocio = urlParams.get('negocio') || 'GellyArt';
        const mesa = urlParams.get('mesa') || '1';

        document.getElementById('info-negocio').innerText = `${negocio.toUpperCase()} - MESA ${mesa}`;

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwHZTPuHu8cVLeBsGHSFD8L7M-DrX1rG5rIQ2NcR03RQ3i-TCQBaQ-8bh4Q0luXLskBBQ/exec";

        function enviarSolicitud(tipoAccion) {
            document.getElementById('status-message.').style.display = 'block';
            
            // Construimos la URL con parámetros GET directos hacia Apps Script para evitar bloqueos
            const urlFinal = `${SCRIPT_URL}?negocio=${encodeURIComponent(negocio)}&mesa=${encodeURIComponent(mesa)}&accion=${encodeURIComponent(tipoAccion)}`;

            // Disparamos la petición en segundo plano mediante un elemento de imagen fantasma (técnica infalible contra CORS)
            const img = new Image();
            img.src = urlFinal;

            document.getElementById('status-message').style.display = 'block';
            
            setTimeout(() => {
                alert("¡Solicitud registrada con éxito!");
            }, 500);
        }
    </script>
</body>
</html>
