<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio a la Mesa - GellyArt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fcfcfc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        h2 {
            color: #e67e22;
            font-size: 20px;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #219653;
        }
        #mensaje-estado {
            margin-top: 15px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="titulo-negocio">CARGANDO...</h1>
        <h2 id="titulo-mesa">Mesa --</h2>
        
        <button class="btn" onclick="enviarSolicitud()">🛎️ LLAMAR AL MESERO</button>
        
        <div id="mensaje-estado"></div>
    </div>

    <script>
        // Capturar los parámetros de la URL (negocio y mesa)
        const urlParams = new URLSearchParams(window.location.search);
        const negocio = urlParams.get('negocio') || 'GellyArt';
        const mesa = urlParams.get('mesa') || '1';

        // Mostrar en pantalla los datos de la mesa actual
        document.getElementById('titulo-negocio').innerText = negocio;
        document.getElementById('titulo-mesa').innerText = "Mesa " + mesa;

        function enviarSolicitud() {
            const estadoDiv = document.getElementById('mensaje-estado');
            estadoDiv.innerHTML = "Enviando aviso...";

            // URL de tu Apps Script recién creada
            const scriptURL = 'https://script.google.com/macros/s/AKfycbyvoQENSIGI_vh2XEyVRVMg8LSHVpXUETeTA3uzn6RSrq953f8oYcNk8z09VNnd96VJ/exec';

            const datos = {
                negocio: negocio,
                mesa: mesa,
                tipo: "Llamar al mesero"
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datos)
            })
            .then(() => {
                estadoDiv.innerHTML = "¡Solicitud enviada con éxito! En un momento te atienden.";
                estadoDiv.style.color = "green";
                setTimeout(() => {
                    estadoDiv.innerHTML = "";
                }, 5000);
            })
            .catch(error => {
                console.error('Error!', error);
                estadoDiv.innerHTML = "Hubo un error al enviar. Intenta de nuevo.";
                estadoDiv.style.color = "red";
            });
        }
    </script>
</body>
</html>
