<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio a la Mesa - GellyArt</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; width: 100%; text-align: center; }
        h2 { color: #333; margin-bottom: 10px; }
        .info { font-size: 18px; color: #555; margin: 15px 0; background: #eef2f3; padding: 10px; border-radius: 6px; }
        .btn-grupo { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        button { background-color: #28a745; color: white; border: none; padding: 14px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: background 0.3s; font-weight: bold; }
        button.cuenta { background-color: #007bff; }
        button:hover { opacity: 0.9; }
        .mensaje-exito { display: none; color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; padding: 15px; border-radius: 6px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>GellyArt - Servicio</h2>
        <div id="detalles-mesa" class="info">
            Cargando información...
        </div>

        <div id="panel-botones" class="btn-grupo">
            <button onclick="enviarSolicitud('SERVICIO')">🔔 LLAMAR AL MESERO (SERVICIO)</button>
            <button class="cuenta" onclick="enviarSolicitud('CUENTA')">💳 PEDIR LA CUENTA</button>
        </div>

        <div id="alerta-exito" class="mensaje-exito">
            ¡Solicitud enviada con éxito! El personal ha sido notificado.
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const negocio = urlParams.get('negocio') || 'GELLYART';
        const mesa = urlParams.get('mesa') || '1';

        document.getElementById('detalles-mesa').innerHTML = 
            `🏢 <strong>Negocio:</strong> ${negocio}<br>📍 <strong>Mesa:</strong> ${mesa}`;

        function enviarSolicitud(tipoSolicitud) {
            document.getElementById('panel-botones').style.display = 'none';
            document.getElementById('detalles-mesa').style.display = 'none';
            document.getElementById('alerta-exito').style.display = 'block';

            // Llamada directa al Apps Script desplegado
            google.script.run
                .withSuccessHandler(function() {
                    console.log("Registrado con éxito");
                })
                .registrarSolicitudWeb(negocio, mesa, tipoSolicitud);
        }
    </script>
</body>
</html>
