<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GELLYART - Servicio a la Mesa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 20px;
        }
        .info-mesa {
            font-size: 1.2rem;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 25px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #218838;
        }
        #mensajeDiv {
            margin-top: 15px;
            font-weight: bold;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="tituloNegocio">GellyArt - Servicio</h2>
        <div class="info-mesa" id="infoMesa">Cargando mesa...</div>
        
        <button id="btnLlamar" onclick="llamarMesero()">¡Llamar al Mesero!</button>
        
        <div id="mensajeDiv"></div>
    </div>

    <script>
        // Obtener parámetros de la URL (ej: ?negocio=ESTHELLA&mesa=3)
        const urlParams = new URLSearchParams(window.location.search);
        const negocio = urlParams.get('negocio') || 'Local';
        const mesa = urlParams.get('mesa') || 'Desconocida';

        // Mostrar los datos en pantalla
        document.getElementById('tituloNegocio').innerText = `Servicio - ${negocio}`;
        document.getElementById('infoMesa').innerText = `Mesa N.° ${mesa}`;

        function llamarMesero() {
            const mensajeDiv = document.getElementById('mensajeDiv');
            const btnLlamar = document.getElementById('btnLlamar');
            
            // URL de tu Web App de Google Apps Script
            const scriptURL = 'https://script.google.com/macros/s/AKfycbwHZTPuHu8cVLeBsGHSFD8L7M-DrX1rG5rIQ2NcR03RQ3i-TCQBaQ-8bh4Q0luXLskBBQ/exec'; 

            const datos = {
                negocio: negocio,
                mesa: mesa,
                timestamp: new Date().toISOString()
            };

            mensajeDiv.style.color = '#555';
            mensajeDiv.innerText = 'Enviando solicitud...';
            btnLlamar.disabled = true;

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datos)
            })
            .then(() => {
                mensajeDiv.style.color = '#28a745';
                mensajeDiv.innerText = '¡Solicitud enviada con éxito!';
                setTimeout(() => {
                    mensajeDiv.innerText = '';
                    btnLlamar.disabled = false;
                }, 4000);
            })
            .catch(error => {
                console.error('Error:', error);
                mensajeDiv.style.color = '#dc3545';
                mensajeDiv.innerText = 'Hubo un error al enviar.';
                btnLlamar.disabled = false;
            });
        }
    </script>
</body>
</html>
