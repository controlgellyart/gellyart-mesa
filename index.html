<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio a la Mesa - GellyArt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }
        /* Nombre de la aplicación: Más grande y llamativo */
        .app-title {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .mesa-info {
            font-size: 16px;
            font-weight: bold;
            color: #e67e22;
            margin-bottom: 15px;
        }
        /* Pregunta fundamental: Destacada para lectura inmediata */
        .question {
            font-size: 20px;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 25px;
            line-height: 1.3;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }
        .btn-servicio {
            background-color: #f1c40f;
            color: #2c3e50;
        }
        .btn-cuenta {
            background-color: #2c3e50;
            color: white;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #95a5a6;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Nombre de la aplicación con mayor jerarquía -->
        <div class="app-title">SERVICIO A LA MESA</div>
        
        <div class="mesa-info" id="mesa-info">CARGANDO...</div>
        
        <!-- Pregunta fundamental más grande para el cliente -->
        <div class="question">¿Cómo podemos ayudarte?</div>

        <button class="btn btn-servicio" onclick="enviarSolicitud('SERVICIO')">🔔 SERVICIO</button>
        <button class="btn btn-cuenta" onclick="enviarSolicitud('CUENTA')">💳 CUENTA</button>
        
        <div class="footer">By GellyArt</div>
    </div>

    <script>
        // Lógica para capturar parámetros de la URL (Negocio y Mesa)
        const urlParams = new URLSearchParams(window.location.search);
        const negocio = urlParams.get('negocio') || 'GellyArt';
        const mesa = urlParams.get('mesa-info') || urlParams.get('mesa') || '1';
        
        document.getElementById('mesa-info').innerText = `${negocio.toUpperCase()} - MESA ${mesa}`;

        function enviarSolicitud(tipo) {
            // Aquí puedes integrar la conexión con tu Apps Script / Google Sheets
            alert(`Solicitud de ${tipo} enviada para ${negocio}, Mesa ${mesa}`);
        }
    </script>
</body>
</html>
