<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GELLYART - Servicio a la Mesa</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #FAF9F6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            box-sizing: border-box;
        }
        h2 { color: #333; margin-bottom: 5px; }
        .mesa-title { font-size: 24px; font-weight: bold; color: #b8860b; margin-bottom: 30px; }
        .btn-container { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 15px; }
        .btn {
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        .btn-servicio { background-color: #2e7d32; }
        .btn-servicio:active { background-color: #1b5e20; transform: scale(0.98); }
        .btn-cuenta { background-color: #c62828; }
        .btn-cuenta:active { background-color: #b71c1c; transform: scale(0.98); }
        #mensajeEstado { margin-top: 20px; font-size: 16px; font-weight: bold; min-height: 24px; }
    </style>
</head>
<body>

    <h2 id="nombreNegocio">Cargando...</h2>
    <div class="mesa-title" id="numeroMesa">Mesa --</div>

    <div class="btn-container">
        <button class="btn btn-servicio" onclick="enviarSolicitud('SERVICIO')">🔔 PEDIR SERVICIO</button>
        <button class="btn btn-cuenta" onclick="enviarSolicitud('CUENTA')">🧾 PEDIR CUENTA</button>
    </div>

    <div id="mensajeEstado"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const negocio = urlParams.get('negocio') || 'GellyArt';
        const mesa = urlParams.get('mesa') || '1';

        document.getElementById('nombreNegocio').innerText = decodeURIComponent(negocio);
        document.getElementById('numeroMesa').innerText = "Mesa " + decodeURIComponent(mesa);

        const scriptURL = "https://script.google.com/macros/s/AKfycbwHZTPuHu8cVLeBsGHSFD8L7M-DrX1rG5rIQ2NcR03RQ3i-TCQBaQ-8bh4Q0luXLskBBQ/exec";

        function enviarSolicitud(accion) {
            const estadoDiv = document.getElementById('mensajeEstado');
            estadoDiv.style.color = "#555";
            estadoDiv.innerText = "Enviando solicitud...";

            const urlFinal = `${scriptURL}?negocio=${encodeURIComponent(negocio)}&mesa=${encodeURIComponent(mesa)}&accion=${encodeURIComponent(accion)}`;

            fetch(urlFinal, { method: 'GET', mode: 'no-cors' })
                .then(() => {
                    estadoDiv.style.color = "green";
                    estadoDiv.innerText = "¡Solicitud enviada con éxito!";
                    setTimeout(() => { estadoDiv.innerText = ""; }, 4000);
                })
                .catch(error => {
                    estadoDiv.style.color = "red";
                    estadoDiv.innerText = "Error al enviar. Intenta de nuevo.";
                    console.error('Error:', error);
                });
        }
    </script>
</body>
</html>
