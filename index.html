<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio a la Mesa - GellyArt</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 320px;
            width: 100%;
        }
        .header-title {
            background-color: #34495e;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        h2 {
            color: #e67e22;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        p {
            color: #555;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #f1c40f;
            color: #2c3e50;
            border: none;
            padding: 15px 20px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #f39c12;
        }
        .btn-cuenta {
            background-color: #2c3e50;
            color: white;
        }
        .btn-cuenta:hover {
            background-color: #34495e;
        }
        #mensaje-estado {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
            min-height: 20px;
        }
        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: #95a5a6;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-title">SERVICIO A LA MESA</div>
        
        <h2 id="titulo-negocio">CARGANDO...</h2>
        <p>¿Cómo podemos ayudarte?</p>

        <button class="btn" onclick="enviarSolicitud('🛎️ SERVICIO')">🛎️ SERVICIO</button>
        <button class="btn btn-cuenta" onclick="enviarSolicitud('💳 CUENTA')">💳 CUENTA</button>
        
        <div id="mensaje-estado"></div>

        <div class="footer">By GellyArt</div>
    </div>

    <script>
        // Capturar los parámetros de la URL (negocio y mesa)
        const urlParams = new URLSearchParams(window.location.search);
        const negocio = urlParams.get('negocio') || 'GellyArt';
        const mesa = urlParams.get('mesa') || '1';

        // Mostrar en pantalla los datos de la mesa actual con el formato original
        document.getElementById('titulo-negocio').innerText = negocio.toUpperCase() + " - MESA " + mesa;

        function enviarSolicitud(tipoServicio) {
            const estadoDiv = document.getElementById('mensaje-estado');
            estadoDiv.style.color = "#2980b9";
            estadoDiv.innerHTML = "Enviando aviso...";

            // URL exacta y probada que registra en la hoja y avisa a Telegram
            const scriptURL = 'https://script.google.com/macros/s/AKfycbwHZTPuHu8cVLeBsGHSFD8L7M-DrX1rG5rIQ2NcR03RQ3i-TCQBaQ-8bh4Q0luXLskBBQ/exec';

            const datos = {
                negocio: negocio,
                mesa: mesa,
                tipo: tipoServicio
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datos)
            })
            .then(() => {
                estadoDiv.style.color = "#27ae60";
                estadoDiv.innerHTML = "¡Solicitud enviada con éxito!";
                setTimeout(() => {
                    estadoDiv.innerHTML = "";
                }, 4000);
            })
            .catch(error => {
                console.error('Error!', error);
                estadoDiv.style.color = "#c0392b";
                estadoDiv.innerHTML = "Hubo un error al enviar. Intenta de nuevo.";
            });
        }
    </script>
</body>
</html>
