<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio a la Mesa - GellyArt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        #info-mesa {
            font-size: 18px;
            color: #666;
            margin-bottom: 25px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .btn-mesero {
            background-color: #d9534f;
        }
        .btn-mesero:hover {
            background-color: #c9302c;
        }
        .btn-cuenta {
            background-color: #f0ad4e;
        }
        .btn-cuenta:hover {
            background-color: #ec971f;
        }
        #mensaje {
            margin-top: 20px;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>GellyArt - Atención</h2>
        <div id="info-mesa">Cargando datos de la mesa...</div>

        <button class="btn btn-mesero" onclick="enviarSolicitud('LLAMAR AL MESERO')">LLAMAR AL MESERO</button>
        <button class="btn btn-cuenta" onclick="enviarSolicitud('PEDIR LA CUENTA')">PEDIR LA CUENTA</button>

        <div id="mensaje"></div>
    </div>

    <script>
        // URL real del Web App de Google Apps Script configurada directamente
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwHZTPuHu8cVLeBsGHSFD8L7M-DrX1rG5rIQ2NcR03RQ3i-TCQBaQ-8bh4Q0luXLskBBQ/exec";

        // Obtener parámetros de la URL (?negocio=NOMBRE&mesa=X)
        const urlParams = new URLSearchParams(window.location.search);
        const negocio = urlParams.get('negocio') || 'Esthella';
        const mesa = urlParams.get('mesa') || '1';

        document.getElementById('info-mesa').innerHTML = `Negocio: <strong>${decodeURIComponent(negocio)}</strong><br>Mesa: <strong>${mesa}</strong>`;

        function enviarSolicitud(accion) {
            const mensajeDiv = document.getElementById('mensaje');
            mensajeDiv.style.color = '#333';
            mensajeDiv.innerText = 'Enviando solicitud...';

            const datos = {
                negocio: decodeURIComponent(negocio),
                mesa: mesa,
                accion: accion,
                timestamp: new Date().toISOString()
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datos)
            })
            .then(() => {
                mensajeDiv.style.color = 'green';
                mensajeDiv.innerText = '¡Solicitud enviada con éxito!';
                setTimeout(() => { mensajeDiv.innerText = ''; }, 4000);
            })
            .catch(error => {
                console.error('Error:', error);
                mensajeDiv.style.color = 'red';
                mensajeDiv.innerText = 'Hubo un error al enviar la solicitud.';
            });
        }
    </script>
</body>
</html>
